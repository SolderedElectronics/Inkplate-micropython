name: CI

on:
  push:
    branches: [refactor]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build check (host-compiled C sources)
        run: |
          gcc -Wall -Wextra -Werror -I firmware/usermods/inkplate -c firmware/usermods/inkplate/board_config.c -o /dev/null
          gcc -Wall -Wextra -Werror -I firmware/usermods/inkplate -c firmware/usermods/inkplate/waveform.c -o /dev/null
          gcc -Wall -Wextra -Werror -I firmware/usermods/inkplate -c firmware/usermods/inkplate/epd_partial_lut.c -o /dev/null

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: ruff format --check (Python)
        run: ruff format --check .
      - name: clang-format check (C)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          clang-format --dry-run --Werror $(find firmware -name '*.c' -o -name '*.h')

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unit test runner (host-compiled C tests)
        run: |
          gcc -Wall -Wextra -I firmware/usermods/inkplate \
            firmware/usermods/inkplate/tests/test_board_config.c \
            firmware/usermods/inkplate/board_config.c \
            -o /tmp/test_board_config
          /tmp/test_board_config
          gcc -Wall -Wextra -I firmware/usermods/inkplate \
            firmware/usermods/inkplate/tests/test_waveform.c \
            firmware/usermods/inkplate/waveform.c \
            firmware/usermods/inkplate/board_config.c \
            -o /tmp/test_waveform
          /tmp/test_waveform
          gcc -Wall -Wextra -I firmware/usermods/inkplate \
            firmware/usermods/inkplate/tests/test_epd_partial_lut.c \
            firmware/usermods/inkplate/epd_partial_lut.c \
            -o /tmp/test_epd_partial_lut
          /tmp/test_epd_partial_lut
